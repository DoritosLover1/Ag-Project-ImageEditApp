syntax = "proto3";

package paicollab.v1;

option java_multiple_files = true;
option java_package = "paicollab.v1";
option java_outer_classname = "PaiCollabProto";

service PaiCollabService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc CreateRoom(RoomCreateRequest) returns (RoomEnterResponse);
  rpc JoinRoom(RoomJoinRequest) returns (RoomEnterResponse);
  rpc LeaveRoom(RoomLeaveRequest) returns (Ack);
  rpc ChangeName(ChangeNameRequest) returns (ChangeNameResponse);

  // Client -> Server: publish an in-room event (draw/chat/cursor/etc.)
  rpc SendEvent(Event) returns (Ack);

  // Client subscribes to receive room events (server-side stream).
  rpc Subscribe(SubscribeRequest) returns (stream Event);
}

message LoginRequest {
  string requested_nickname = 1;
}

message LoginResponse {
  bool success = 1;
  string approved_nickname = 2;
  string error_message = 3;
}

message RoomCreateRequest {
  string nickname = 1;
}

message RoomJoinRequest {
  string nickname = 1;
  string room_code = 2;
}

message RoomLeaveRequest {
  string nickname = 1;
  string room_code = 2;
}

message RoomEnterResponse {
  bool success = 1;
  string room_code = 2;
  string error_message = 3;

  // Initial data (snapshot) after entering a room.
  repeated Event snapshot_events = 10;
  repeated string users = 11;
}

message ChangeNameRequest {
  string old_nickname = 1;
  string new_nickname = 2;
}

message ChangeNameResponse {
  bool success = 1;
  string approved_nickname = 2;
  string error_message = 3;
}

message SubscribeRequest {
  string nickname = 1;
  string room_code = 2;
}

message Ack {
  bool success = 1;
  string error_message = 2;
}

message Event {
  string room_code = 1;
  int64 timestamp_ms = 2;
  string sender = 3;
  EventType type = 4;

  oneof payload {
    ShapeEvent shape = 10;
    ImageEvent image = 11;
    CursorEvent cursor = 12;
    DeleteEvent delete = 13;
    ClearEvent clear = 14;
    ChatEvent chat = 15;
    ChatHistoryEvent chat_history = 16;
    UserListEvent user_list = 17;
  }
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_SHAPE = 1;
  EVENT_TYPE_IMAGE = 2;
  EVENT_TYPE_CURSOR = 3;
  EVENT_TYPE_DELETE = 4;
  EVENT_TYPE_CLEAR = 5;
  EVENT_TYPE_CHAT = 6;
  EVENT_TYPE_CHAT_HISTORY = 7;
  EVENT_TYPE_USER_LIST = 8;
}

message ShapeEvent {
  ShapeType shape_type = 1;
  string id = 2;
  string color = 3;      // "#RRGGBB"
  int32 stroke = 4;
  bool filled = 5;

  // Rectangle/Ellipse bounding box
  int32 x = 10;
  int32 y = 11;
  int32 w = 12;
  int32 h = 13;

  // Line
  int32 x1 = 20;
  int32 y1 = 21;
  int32 x2 = 22;
  int32 y2 = 23;

  // Triangle
  int32 tx1 = 30;
  int32 ty1 = 31;
  int32 tx2 = 32;
  int32 ty2 = 33;
  int32 tx3 = 34;
  int32 ty3 = 35;

  // Freehand
  repeated int32 xs = 40;
  repeated int32 ys = 41;
}

enum ShapeType {
  SHAPE_TYPE_UNSPECIFIED = 0;
  SHAPE_TYPE_SQUARE = 1;
  SHAPE_TYPE_CIRCLE = 2;
  SHAPE_TYPE_LINE = 3;
  SHAPE_TYPE_TRIANGLE = 4;
  SHAPE_TYPE_FREEHAND = 5;
}

message ImageEvent {
  string id = 1;
  int32 x = 2;
  int32 y = 3;
  int32 w = 4;
  int32 h = 5;
  bytes png_bytes = 6;
}

message CursorEvent {
  int32 x = 1;
  int32 y = 2;
  string color = 3;
}

message DeleteEvent {
  string target_id = 1;
}

message ClearEvent {
  string scope = 1; // "ALL"
}

message ChatEvent {
  string message = 1;
}

message ChatHistoryEvent {
  string original_sender = 1;
  string message = 2;
  int64 original_timestamp_ms = 3;
}

message UserListEvent {
  repeated string users = 1;
}

